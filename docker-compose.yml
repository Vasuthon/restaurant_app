services:
  db:
    image: mysql:8.0
    container_name: restaurant_app_db
    restart: unless-stopped
    command: --default-time-zone=+07:00
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Bangkok
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: .
    container_name: restaurant_app_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      STAFF_PIN: ${STAFF_PIN}
      TZ: Asia/Bangkok
      # IP วงแลนจริงของเครื่อง host (ตรวจโดย docker-up.ps1 ก่อนสั่ง up) ใช้สร้างลิงก์/QR ให้ลูกค้าสแกน
      HOST_LAN_IP: ${HOST_LAN_IP:-}
    volumes:
      - ./index.php:/var/www/html/index.php
      - ./staff.php:/var/www/html/staff.php
      - ./partials:/var/www/html/partials
      - ./assets:/var/www/html/assets
      - ./api:/var/www/html/api
      - ./config:/var/www/html/config
      - ./uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: restaurant_app_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
